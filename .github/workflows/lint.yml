name: Lint Markdown

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Markdown lint
        run: python scripts/lint.py

      - name: Regenerate TOC (verify no changes)
        run: |
          python scripts/gen_toc.py
          if [[ -n "$(git status --porcelain 00-总目录.md)" ]]; then
            echo "ERROR: 00-总目录.md 不是最新的，请本地运行 python scripts/gen_toc.py 并提交。"
            exit 1
          fi
